<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Rounded Background Card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Growth Area Fill -->
  <path d="M 12 48 L 24 38 L 36 40 L 52 20 L 52 48 Z" fill="url(#chartGrad)" />

  <!-- Trending Growth Line -->
  <path d="M 12 48 L 24 38 L 36 40 L 52 20" fill="none" stroke="#34d399" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Arrow Top Right -->
  <path d="M 42 20 H 52 V 30" fill="none" stroke="#34d399" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Piggy Bank silhouette -->
  <path d="M 22 28 C 22 23.5 25.5 20 30 20 C 34.5 20 38 23.5 38 28 C 38 32.5 34.5 36 30 36 C 25.5 36 22 32.5 22 28 Z" fill="#ffffff" opacity="0.95" />
  
  <!-- Coin Drop -->
  <circle cx="30" cy="14" r="3.5" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5" />
</svg>